<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Mobile Viewport & Fullscreen Capabilities -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0d11" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Battle Auction" />

    <title>MARVEL BATTLE AUCTION — BID. BUILD. BATTLE.</title>
    <meta name="description" content="Real-time superhero auction and tournament battle game. Bid against friends, assemble your ultimate Marvel roster, and clash in cinematic matches!" />

    <!-- Google Fonts: Bangers (Comic titles), Montserrat (Punchy UI headers), Inter (Clean body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@400;600;700;900&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet" />

    <style>
      /* Fast, Zero-Dependency Native PWA Instant Splash Screen */
      #pwa-splash {
        position: fixed;
        inset: 0;
        background-color: #0d0d11;
        background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1.5px, transparent 1.5px),
                          radial-gradient(rgba(217, 37, 37, 0.05) 1.5px, transparent 1.5px);
        background-size: 24px 24px, 48px 48px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        color: #ffffff;
        font-family: system-ui, -apple-system, sans-serif;
        text-align: center;
        padding: 24px;
        user-select: none;
      }
      .splash-emblem {
        width: 80px;
        height: 80px;
        background: #ef4444;
        border: 4px solid #000000;
        box-shadow: 6px 6px 0px #000000;
        display: flex;
        align-items: center;
        justify-content: center;
        transform: rotate(-6deg);
        margin-bottom: 20px;
      }
      .splash-bolt {
        font-size: 40px;
        line-height: 1;
      }
      .splash-tagline {
        background: #ffd100;
        color: #000000;
        border: 2px solid #000000;
        box-shadow: 3px 3px 0px #000000;
        font-weight: 900;
        font-size: 13px;
        letter-spacing: 0.15em;
        padding: 3px 12px;
        transform: skew(-8deg);
        margin-bottom: 12px;
      }
      .splash-title {
        font-family: 'Bangers', Impact, sans-serif;
        font-size: 36px;
        letter-spacing: 0.05em;
        color: #ffffff;
        text-shadow: 2px 2px 0px #000000;
        margin: 0;
        line-height: 1.1;
      }
      .splash-spinner {
        margin-top: 28px;
        width: 32px;
        height: 32px;
        border: 3px solid rgba(255, 209, 0, 0.2);
        border-top-color: #ffd100;
        border-radius: 50%;
        animation: splashSpin 0.8s linear infinite;
      }
      @keyframes splashSpin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="bg-comic-dark text-slate-100 antialiased selection:bg-comic-yellow selection:text-black">
    <!-- Instant PWA / TWA Splash Container -->
    <div id="pwa-splash">
      <div class="splash-emblem">
        <span class="splash-bolt">⚡</span>
      </div>
      <div class="splash-tagline">BID. BUILD. BATTLE.</div>
      <h1 class="splash-title">MARVEL BATTLE AUCTION</h1>
      <div class="splash-spinner"></div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
