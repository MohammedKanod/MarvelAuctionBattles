<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Mobile Viewport & Fullscreen Capabilities -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0d11" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Battle Auction" />

    <title>BATTLE AUCTION — Superhero Multiverse Clash</title>
    <meta name="description" content="Real-time superhero auction and tournament battle arena. Draft legendary champions from Marvel and DC, assemble your ultimate squad, and clash in cinematic battles!" />
    <meta name="google-site-verification" content="googled016f19f409fda09" />

    <!-- Google Fonts: Bangers (Comic titles), Montserrat (Punchy UI headers), Inter (Clean body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@400;600;700;900&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet" />

    <style>
      /* Fast, Zero-Dependency Native PWA Instant Splash Screen */
      #pwa-splash {
        position: fixed;
        inset: 0;
        background-color: #0d0d11;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        user-select: none;
        transition: opacity 0.35s ease-out;
      }
      .splash-emblem {
        width: 110px;
        height: 110px;
        margin-bottom: 20px;
        border: 3px solid #ffd100;
        box-shadow: 4px 4px 0px #000000, 0 0 30px rgba(255, 209, 0, 0.4);
        border-radius: 12px;
        overflow: hidden;
      }
      .splash-emblem img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .splash-tagline {
        background: #ffd100;
        color: #000000;
        font-family: 'Bangers', cursive, sans-serif;
        font-size: 16px;
        letter-spacing: 2px;
        padding: 2px 14px;
        border: 2px solid #000000;
        box-shadow: 3px 3px 0px #000000;
        transform: rotate(-1.5deg);
        margin-bottom: 8px;
      }
      .splash-title {
        font-family: 'Bangers', cursive, sans-serif;
        font-size: 38px;
        letter-spacing: 3px;
        color: #ffffff;
        text-shadow: 3px 3px 0px #000000, 0 0 20px rgba(255, 42, 42, 0.5);
        margin: 0;
        line-height: 1.1;
      }
      .splash-spinner {
        margin-top: 28px;
        width: 32px;
        height: 32px;
        border: 3px solid rgba(255, 209, 0, 0.2);
        border-top-color: #ffd100;
        border-radius: 50%;
        animation: splashSpin 0.8s linear infinite;
      }
      @keyframes splashSpin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="bg-comic-dark text-slate-100 antialiased selection:bg-comic-yellow selection:text-black">
    <!-- Instant PWA / TWA Splash Container -->
    <div id="pwa-splash">
      <div class="splash-emblem">
        <img src="/logo.png" alt="Battle Auction" />
      </div>
      <div class="splash-tagline">SUPERHERO MULTIVERSE CLASH</div>
      <h1 class="splash-title">BATTLE AUCTION</h1>
      <div class="splash-spinner"></div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
